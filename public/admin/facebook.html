<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simit Astana - Facebook Messenger</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-[#F4F1EA] text-[#241C15]"><main class="max-w-4xl mx-auto p-5"><header class="flex flex-wrap items-center justify-between gap-3 mb-6"><div><h1 class="text-2xl font-semibold">Facebook Messenger Bot</h1><p class="text-sm text-[#6B5F4F]">Page messaging and table-order automation</p></div><nav class="flex gap-2"><a class="border rounded-lg px-3 py-2 text-sm" href="/admin/index.html">Main admin</a><a class="border rounded-lg px-3 py-2 text-sm" href="/admin/webhooks.html">Webhook Log</a></nav></header>
<section class="bg-white border border-[#E6DBC8] rounded-xl p-5 mb-5"><h2 class="font-semibold mb-3">Connection</h2><p class="text-sm text-[#6B5F4F] mb-4">Sign in with Meta to choose a Facebook Page, or connect manually with an access token.</p><div class="grid gap-3"><button id="metaLogin" class="bg-[#1877F2] text-white rounded-lg p-2">Continue with Facebook</button><p id="oauthStatus" class="text-sm"></p><div class="border-t border-[#E6DBC8] pt-3 grid gap-3"><input id="token" class="border rounded-lg p-2" type="password" placeholder="Meta user access token"><button id="lookup" class="bg-[#241C15] text-white rounded-lg p-2">Find Pages</button><select id="pages" class="border rounded-lg p-2 hidden"></select><input id="secret" class="border rounded-lg p-2" type="password" placeholder="App Secret (optional)"><button id="save" class="bg-[#5C6B35] text-white rounded-lg p-2 hidden">Save selected Page</button></div><p id="status" class="text-sm"></p></div></section>
<section class="bg-white border border-[#E6DBC8] rounded-xl p-5 mb-5"><h2 class="font-semibold mb-3">Welcome and follow-up</h2><div class="grid gap-3"><textarea id="welcome" class="border rounded-lg p-2" rows="3" placeholder="Welcome message"></textarea><input id="order" class="border rounded-lg p-2" placeholder="Order button label"><input id="location" class="border rounded-lg p-2" placeholder="Location button label"><input id="menu" class="border rounded-lg p-2" placeholder="Menu button label"><textarea id="followup" class="border rounded-lg p-2" rows="2" placeholder="Follow-up message"></textarea><input id="delay" class="border rounded-lg p-2" type="number" min="1" placeholder="Follow-up delay in minutes"><input id="owner" class="border rounded-lg p-2" placeholder="Owner Messenger sender ID (optional)"><button id="settings" class="bg-[#241C15] text-white rounded-lg p-2">Save settings</button><p id="settingsStatus" class="text-sm"></p></div></section>
<section class="bg-white border border-[#E6DBC8] rounded-xl p-5"><h2 class="font-semibold mb-3">Keyword automations</h2><div class="grid gap-3"><input id="keyword" class="border rounded-lg p-2" placeholder="Keyword"><textarea id="response" class="border rounded-lg p-2" rows="2" placeholder="Automatic reply"></textarea><button id="addKeyword" class="bg-[#241C15] text-white rounded-lg p-2">Add keyword</button><div id="keywords" class="grid gap-2"></div><p id="keywordStatus" class="text-sm"></p></div></section></main>
<script>
const auth=()=>({"Content-Type":"application/json",Authorization:`Bearer ${sessionStorage.getItem("simit_admin_token")||""}`}); const status=document.querySelector("#status");
let selected=null;
async function api(path,options={}){const res=await fetch(path,{...options,headers:{...auth(),...(options.headers||{})}});const data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||`Request failed (${res.status})`);return data;}
metaLogin.onclick=async()=>{try{const data=await api("/api/admin/facebook/auth-url");window.location.href=data.url;}catch(e){oauthStatus.textContent=e.message;}};
const authResult=new URLSearchParams(location.search).get("facebookAuth"); if(authResult==="connected")oauthStatus.textContent="Facebook Page connected and webhook subscribed."; if(authResult==="error")oauthStatus.textContent=`Facebook login failed: ${new URLSearchParams(location.search).get("reason")||"Unknown error."}`; if(new URLSearchParams(location.search).get("facebookWebhook")==="error")oauthStatus.textContent="Page connected, but Meta webhook subscription failed. Use the manual resubscribe endpoint.";
lookup.onclick=async()=>{try{const data=await api("/api/admin/facebook/connection/lookup",{method:"POST",body:JSON.stringify({accessToken:token.value})});pages.innerHTML=data.pages.map((p,i)=>`<option value="${i}">${p.pageName} (${p.pageId})</option>`).join("");selected=data.pages;pages.classList.remove("hidden");save.classList.remove("hidden");status.textContent=`Found ${data.pages.length} Page(s).`; }catch(e){status.textContent=e.message;}};
save.onclick=async()=>{try{const p=selected[Number(pages.value)];await api("/api/admin/facebook/connection",{method:"POST",body:JSON.stringify({pageId:p.pageId,pageName:p.pageName,accessToken:p.pageAccessToken,appSecret:secret.value})});status.textContent="Saved and subscribed to Messenger webhooks.";}catch(e){status.textContent=e.message;}};
settings.onclick=async()=>{try{await api("/api/admin/facebook/settings",{method:"PUT",body:JSON.stringify({welcome_message:welcome.value,order_button_label:order.value,location_button_label:location.value,menu_button_label:menu.value,followup_message:followup.value,followup_delay_minutes:delay.value,owner_fb_sender_id:owner.value})});settingsStatus.textContent="Settings saved.";}catch(e){settingsStatus.textContent=e.message;}};
async function loadKeywords(){try{const data=await api("/api/admin/facebook/keywords");keywords.innerHTML=data.keywords.map((item)=>`<div class="flex items-center justify-between gap-3 border rounded-lg p-2 text-sm"><span><b>${item.keyword}</b> - ${item.response}</span><button data-id="${item.id}" class="deleteKeyword text-[#AE3B26]">Delete</button></div>`).join("");document.querySelectorAll(".deleteKeyword").forEach((button)=>button.onclick=async()=>{await api(`/api/admin/facebook/keywords/${button.dataset.id}`,{method:"DELETE"});loadKeywords();});}catch(e){keywordStatus.textContent=e.message;}}
addKeyword.onclick=async()=>{try{await api("/api/admin/facebook/keywords",{method:"POST",body:JSON.stringify({keyword:keyword.value,response:response.value})});keyword.value="";response.value="";keywordStatus.textContent="Keyword added.";loadKeywords();}catch(e){keywordStatus.textContent=e.message;}};
(async()=>{try{const d=await api("/api/admin/facebook/settings");const s=d.settings;welcome.value=s.welcome_message;order.value=s.order_button_label;location.value=s.location_button_label;menu.value=s.menu_button_label;followup.value=s.followup_message;delay.value=s.followup_delay_minutes;owner.value=s.owner_fb_sender_id||"";}catch(e){settingsStatus.textContent=e.message;}})();
loadKeywords();
</script></body></html>
